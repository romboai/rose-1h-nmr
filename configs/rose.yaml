grid:
  ppm_min: 0.0
  ppm_max: 14.0
  num_points: 4096

spectral_encoder:
  spectrum_length: 4096
  patch_size: 32
  embed_dim: 256
  num_layers: 8
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.1
  drop_path_rate: 0.1
  num_metadata_tokens: 4
  solvent_vocab_size: 32
  conv_stem:
    enabled: true
    channels: 32
    num_layers: 3
    kernel_size: 7
    dilations: [1, 2, 4]

structure_encoder:
  type: graph_transformer
  hidden_dim: 256
  num_layers: 4
  num_heads: 4
  dropout: 0.1

heads:
  contrastive_proj_dim: 128
  pair_temperature: 0.1
  forward_max_peaks: 32
